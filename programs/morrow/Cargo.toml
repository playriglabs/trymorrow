[package]
name = "morrow"
version = "0.1.0"
description = "Recipient-bound stock gifts"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "morrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[lints.rust]
# Anchor/Solana macros expand these cfgs in this crate. Register them with
# rustc's check-cfg lint so newer toolchains do not report false positives.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
] }

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
# anchor 0.32's solana_program re-export has no hash module; same sha256 syscall, Hash type from solana-hash
solana-sha256-hasher = "2.3.0"
